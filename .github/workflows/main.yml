name: Github CI
on:
  push:
    branches:
      - master
      - smoke/*
      - gh/*
    tags:
      - '0.*.*'
      - '0.*'
  pull_request:
    branches:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

#strategy:
#  matrix:
#    os: [ubuntu-14.04, ubuntu-18.04, ubuntu-20.04, ubuntu-latest]

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: true
      matrix:
        CONFIGURE_ARGS:
          - CFLAGS="-O1 -fno-omit-frame-pointer -fsanitize=address -fno-var-tracking" --disable-bindings --disable-docs
          - CC="clang"
          - --enable-release
          - --enable-gcov --disable-bindings --disable-docs CFLAGS="-O0 -g"
          - --disable-write --disable-docs
          - --host=i686-linux-gnu --disable-bindings --disable-docs
          - CFLAGS="-O2 -fno-omit-frame-pointer -fsanitize=undefined -fno-sanitize-recover=undefined -fno-var-tracking" --disable-bindings --disable-docs
          - --enable-debug
    steps:
    - if: ${{ startsWith(github.ref, 'refs/tags/') }}
      name: checkout for tag
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
    - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      name: checkout for commit --depth 50
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-tags: true
        fetch-depth: 50
        submodules: recursive
    #- name: setup-python
    #  uses: actions/setup-python@v5
    #  with:
    #    python-version: '3.11'
    - if: contains(matrix.CONFIGURE_ARGS, 'i686-linux-gnu')
      name: setup gcc-multilib
      run: |
        sudo apt-get -y update
        sudo apt-get -y install gcc-multilib
    #- name: setup-python-libxml2
    #  run: |
    #    python -m pip install --upgrade pip
    #    python -m pip install --upgrade libxml2-python3
    - if: contains(matrix.CONFIGURE_ARGS, '--enable-release')
      name: setup --enable-release
      run: |
        sudo apt-get -y update
        sudo apt-get -y install texlive help2man libconvert-binary-c-perl shellcheck \
          swig python3-dev python3-lxml libxml2-dev libpcre2-dev libpcre2-32-0 jq \
          pkg-config shellcheck parallel rpmlint shfmt doxygen jing valgrind cppcheck \
          gperf intltool latexml
        build-aux/install-libxslt
        build-aux/install-pslib
        build-aux/install-relaxng-svg11
        sudo npm i -g geojson-validation
    # Only master saves compiler caches; other runs restore master's.
    # Caches saved from every pull request push would fill the
    # repository's cache space and evict master's.
    - uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
      with:
        create-symlink: true
        key: ${{ github.job }}-${{ matrix.CONFIGURE_ARGS }}
        save: ${{ github.ref == 'refs/heads/master' }}
        evict-old-files: job
    - run: sh autogen.sh
    - if: contains(matrix.CONFIGURE_ARGS, '-fsanitize=address')
      name: Fix kernel mmap rnd bits for -fsanitize=address
      run: |
        # echo "-fsanitize=address run-time broken in latest ubuntu image update from March 10, 2024"
        # https://github.com/actions/runner-images/issues/9491
        # Asan in llvm 14 provided in ubuntu 22.04 is incompatible with
        # high-entropy ASLR in much newer kernels that GitHub runners are
        # using leading to random crashes: https://reviews.llvm.org/D148280
        sudo sysctl vm.mmap_rnd_bits=28
    - run: ./configure ${{ matrix.CONFIGURE_ARGS }}
    - if: ${{ !contains(matrix.CONFIGURE_ARGS, '--enable-release') }}
      run: make -j
    - if: ${{ !contains(matrix.CONFIGURE_ARGS, '--enable-release') &&
              !contains(matrix.CONFIGURE_ARGS, '--enable-debug') &&
              (startsWith(github.ref, 'refs/heads/') ||
               github.event_name == 'pull_request' ||
               contains(matrix.CONFIGURE_ARGS, '--enable-gcov')) }}
      run: make -j check
    #  run: |
    #    python -m pip install cpp-coveralls
    #    make gcov
    #    coveralls -e test -e bindings
    - if: contains(matrix.CONFIGURE_ARGS, '--enable-gcov')
      id: codecov-token
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      run: echo "set=${CODECOV_TOKEN:+yes}" >> "$GITHUB_OUTPUT"
    # Codecov rejects uploads without a token: skip the upload where none is set.
    - if: steps.codecov-token.outputs.set == 'yes'
      timeout-minutes: 65
      name: Run make codecov if --enable-gcov
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      run: make codecov
    - if: contains(matrix.CONFIGURE_ARGS, '--enable-release')
      name: Run make distcheck if --enable-release
      run: |
        make regen-dynapi
        # Bounded: an unbounded -j made distcheck slower.
        make -j"$(nproc)" distcheck
    - if: contains(matrix.CONFIGURE_ARGS, '--enable-release') && startsWith(github.ref, 'refs/tags/')
      name: Prep-Release
      run: sha256sum libredwg-*.tar.* > dist.sha256
    - if: contains(matrix.CONFIGURE_ARGS, '--enable-release') && startsWith(github.ref, 'refs/tags/')
      name: Release
      continue-on-error: true
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        body_path: dist.sha256
        files: |
          dist.sha256
          libredwg-*.tar.*
  ppc64-big-endian:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        submodules: recursive
    - run: sudo apt-get -y update && sudo apt-get -y install gcc-powerpc64-linux-gnu libc6-ppc64-cross qemu-system-ppc binfmt-support qemu-user qemu-user-binfmt
    - uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
      with:
        key: ${{ github.job }}
        save: ${{ github.ref == 'refs/heads/master' }}
        evict-old-files: job
    - run: sh autogen.sh
    - run: CC="ccache powerpc64-linux-gnu-gcc" ./configure --host=powerpc64-linux-gnu --disable-bindings --disable-python
    - run: make -j
    - run: cd /lib64 && sudo ln -s /usr/powerpc64-linux-gnu/lib/ld64.so.1
    # Big-endian reading and writing are broken, so these tests are expected
    # to fail here (P1-09-FU3). One that passes (XPASS) fails the job.
    - run: make -C programs check-minimal XFAIL_TESTS="alive.test"
    - run: >-
        make -C test/unit-testing check-minimal
        XFAIL_TESTS="bits_test dynapi_test dxf_test add_test dynblocks_test dynblock_eval_test dynblock_insert_test dynblock_author_test fields_test copy_test color_test indxf_test eed_test"
  mips32-big-endian:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        submodules: recursive
    - run: sudo apt-get -y update && sudo apt-get -y install gcc-mips-linux-gnu gcc-multilib-mips-linux-gnu
    - uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
      with:
        key: ${{ github.job }}
        save: ${{ github.ref == 'refs/heads/master' }}
        evict-old-files: job
    - run: sh autogen.sh
    - run: CC="ccache mips-linux-gnu-gcc" CFLAGS=-Os ./configure --host=mips-linux-gnu --disable-bindings --disable-python
    - run: make -j
  linux-cmake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    #strategy:
    #  fail-fast: true
    #  matrix:
    #    CMAKE_ARGS:
    #      - ""
    #      - "-DLIBREDWG_LIBONLY=On -DLIBREDWG_DISABLE_JSON=On"
    #      - "-DLIBREDWG_DISABLE_WRITE=On"
    steps:
    - name: setup-python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 3.12
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        submodules: recursive
    - uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
      with:
        create-symlink: true
        key: ${{ github.job }}
        save: ${{ github.ref == 'refs/heads/master' }}
        evict-old-files: job
    - run: cmake -DLIBREDWG_LIBONLY=On -DCMAKE_C_COMPILER_LAUNCHER=ccache .
    - run: make -j
    - run: make -j test
    - if: failure()
      run: tar cfz cmake-failure.tgz Testing/Temporary/LastTest.log src/config.h
    - if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: cmake-failure.tgz
        path: cmake-failure.tgz
  macOS:
    name: macOS
    runs-on: macOS-latest
    steps:
    - name: init
      run: brew install autoconf automake libtool texinfo
    - name: link texinfo
      run: brew link texinfo --force
    - name: setup-python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 3.12
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        submodules: recursive
    - uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
      with:
        create-symlink: true
        key: ${{ github.job }}
        save: ${{ github.ref == 'refs/heads/master' }}
        evict-old-files: job
    - run: sh autogen.sh
    - run: ./configure --disable-bindings --disable-werror
    - run: PATH="/usr/local/opt/texinfo/bin:$PATH" make
    - run: PATH="/usr/local/opt/texinfo/bin:$PATH" make check
    #- run: make distcheck
  mingw:
    name: mingw
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      MSYS2_DIR: msys64
      MSYS2_ARCH: x86_64
      MSYSTEM: MINGW64
      ARCH: win64
      PLATFORM: x64
      #PATH: "C:\%MSYS2_DIR%\%MSYSTEM%\bin;C:\%MSYS2_DIR%\usr\bin;%PATH%"
    steps:
      # see https://github.com/msys2/setup-msys2
    - name: setup-msys2
      uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
      with:
        path-type: minimal
        update: true
        cache: true
        install: >-
          git
          base-devel
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-libtool
          mingw-w64-x86_64-libiconv
          mingw-w64-x86_64-libxml2
          mingw-w64-x86_64-libxslt
          mingw-w64-x86_64-swig
          mingw-w64-x86_64-python
          libtool
          autoconf-wrapper
          automake-wrapper
          texinfo
          gperf
          mingw-w64-x86_64-perl
          mingw-w64-x86_64-pcre2
          python-lxml
          mingw-w64-x86_64-ccache
    - run: reg add "HKLM\Software\Microsoft\Windows\Windows Error Reporting" /f /v DontShowUI /d 1
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        submodules: recursive
    # Compiler cache, restored and saved like the ccache-action caches.
    # CC is given to make rather than configure, so configure runs and
    # decides exactly as it does without the cache.
    - shell: msys2 {0}
      run: |
        echo "CCACHE_DIR=$(cygpath -m "$RUNNER_TEMP")/ccache" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"
        echo "MINGW_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ccache
        key: ccache-mingw-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ccache-mingw-
    - shell: msys2 {0}
      run: sh ./autogen.sh
    - shell: msys2 {0}
      run: ./configure --disable-dependency-tracking
    # The make steps have time limits of their own: a step over its limit
    # fails the job, where a job over its limit is reported as cancelled.
    - shell: msys2 {0}
      timeout-minutes: 28
      run: make -j CC="ccache gcc"
    - if: failure()
      shell: msys2 {0}
      run: make -C src dwg_api.i; tar cfz mingw-failure.tgz src/dwg_api.i src/config.h
    - if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: mingw-failure.tgz
        path: mingw-failure.tgz
    # If make check is still running after 15 minutes (it takes 6-13), list
    # the running processes, to show what it is waiting for. The time limit
    # ends every process, so a later step would find none.
    - shell: msys2 {0}
      timeout-minutes: 20
      run: |
        make -j check CC="ccache gcc" &
        make_pid=$!
        listed=
        while kill -0 $make_pid 2>/dev/null; do
          sleep 5
          if [ -z "$listed" ] && [ $SECONDS -ge 900 ]; then
            listed=1
            echo "make check has run for 15 minutes. Running processes:"
            ps -ef || true
            powershell -NoProfile -Command "Get-CimInstance Win32_Process | Format-Table ProcessId,ParentProcessId,Name,UserModeTime,KernelModeTime,WorkingSetSize,CommandLine -AutoSize -Wrap | Out-String -Width 4096" || true
          fi
        done
        wait $make_pid
    - if: ${{ !cancelled() }}
      shell: msys2 {0}
      run: ccache -s
    # Keep only the files this build used.
    - if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
      shell: msys2 {0}
      run: ccache --evict-older-than "$(( $(date +%s) - MINGW_JOB_START + 60 ))s"
    - if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ccache
        key: ccache-mingw-${{ github.run_id }}-${{ github.run_attempt }}
  mingw-cmake:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - name: setup-msys2
      uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
      with:
        path-type: minimal
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        submodules: recursive
    - uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
      with:
        key: ${{ github.job }}
        save: ${{ github.ref == 'refs/heads/master' }}
        evict-old-files: job
    - run: cmake -G "MinGW Makefiles" -DDISABLE_WERROR=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache .
    - run: mingw32-make -j VERBOSE=1 | tee make.log
    - if: failure()
      run: tar cfz msys-failure.tgz make.log src/config.h
    - if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: msys-failure.tgz
        path: msys-failure.tgz
  vs2019:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        submodules: recursive
    - run: cmake -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release .
    - run: cmake --build . --config Release
    - run: copy Release/libredwg.dll test/unit-testing/Release/
    - run: ctest . --output-on-failure
    - if: failure()
      run: tar cfz msvc-failure.tgz Testing/Temporary/LastTest.log src/config.h
    - if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: msvc-failure.tgz
        path: msvc-failure.tgz
  vs2019-ninja:
    runs-on: windows-2022
    timeout-minutes: 20
    #env:
    #  ACTIONS_ALLOW_UNSECURE_COMMANDS: true
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        submodules: recursive
    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
    # - run: choco install ninja
      # use the preinstalled vcpkg from image
      # https://github.com/actions/virtual-environments/blob/main/images/win/Windows2019-Readme.md#package-management
    #- name: Setup vcpkg
    #  uses: lukka/run-vcpkg@v11
    #  with:
    #    vcpkgDirectory: C:/vcpkg
    #    doNotUpdateVcpkg: true  # the preinstalled vcpkg is updated regularly
    #    vcpkgJsonGlob: 'vcpkg.json.in'
    - name: cmake -G "Ninja"
      shell: cmd
      run: |
        cmake -G "Ninja" . ^
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake ^
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-release ^
          -DVERBOSE_CONFIGURE=ON ^
          -DCMAKE_CXX_COMPILER=cl ^
          -DCMAKE_C_COMPILER=cl
    - run: ninja
    - run: copy libredwg.dll test\unit-testing\
    - run: ctest . --output-on-failure
